[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-agent-launcher"
version = "0.1.0"
description = "Open terminal coding-agent sessions in any local project folder"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Caleb Bolden" }]
keywords = ["terminal", "coding-agents", "claude-code", "codex", "iterm2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: User Interfaces",
]

[project.scripts]
terminal-agent-launcher = "terminal_agent_launcher.__main__:main"
tal = "terminal_agent_launcher.cli:main"

[project.urls]
Homepage = "https://github.com/cbolden15/terminal-agent-launcher"
Issues = "https://github.com/cbolden15/terminal-agent-launcher/issues"
Repository = "https://github.com/cbolden15/terminal-agent-launcher.git"

[tool.setuptools]
include-package-data = true
packages = ["terminal_agent_launcher", "agent_launchpad"]

[tool.setuptools.package-data]
terminal_agent_launcher = ["web/*.html", "web/assets/*.css", "web/assets/*.js"]

[tool.pyright]
pythonVersion = "3.9"
